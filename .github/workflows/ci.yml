name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src app scripts tests
      - run: python -m ruff format --check src app scripts tests
      - run: python -m pytest --cov=src --cov=app --cov-report=term-missing
      - run: docker compose --profile monitoring config --quiet
